---
- name: Создание директории ~/.config
  ansible.builtin.file:
    path: "{{ home_dir }}/.config"
    state: directory
    mode: '0755'

- name: Получение информации о существующих путях dotfiles
  ansible.builtin.stat:
    path: "{{ home_dir }}/{{ item.dest }}"
  loop: "{{ dotfiles_links }}"
  register: dotfiles_stats

- name: Резервное копирование существующих директорий (добавление .bak)
  ansible.builtin.command: "mv {{ item.stat.path }} {{ item.stat.path }}.bak.{{ ansible_date_time.iso8601 }}"
  loop: "{{ dotfiles_stats.results }}"
  when:
    - item.stat.exists
    - item.stat.isdir
    - not item.stat.islnk
  args:
    removes: "{{ item.stat.path }}"

- name: Создание симлинков для dotfiles
  ansible.builtin.file:
    src: "{{ dotfiles_repo_path }}/{{ item.src }}"
    dest: "{{ home_dir }}/{{ item.dest }}"
    state: link
    force: yes
  loop: "{{ dotfiles_links }}"
  become: false

- name: Симлинк для папки Themes (для совместимости)
  ansible.builtin.file:
    src: "{{ dotfiles_repo_path }}/Themes"
    dest: "{{ home_dir }}/Documents/Themes"
    state: link
    force: yes
  become: false

- name: Исправление прав доступа для aerc/accounts.conf
  ansible.builtin.file:
    path: "{{ dotfiles_repo_path }}/aerc/accounts.conf"
    mode: '0600'
  become: false

- name: Установка скрипта check_mail.py
  ansible.builtin.copy:
    src: "{{ dotfiles_repo_path }}/scripts/check_mail.py"
    dest: "{{ local_bin_dir }}/check_mail.py"
    mode: '0755'
    remote_src: no
  become: false

- name: Создание директории ~/.config/systemd/user
  ansible.builtin.file:
    path: "{{ home_dir }}/.config/systemd/user"
    state: directory
    mode: '0755'
  become: false

- name: Установка systemd сервиса check-mail.service
  ansible.builtin.copy:
    src: "{{ dotfiles_repo_path }}/scripts/check-mail.service"
    dest: "{{ home_dir }}/.config/systemd/user/check-mail.service"
    mode: '0644'
    remote_src: no
  become: false

- name: Установка systemd таймера check-mail.timer
  ansible.builtin.copy:
    src: "{{ dotfiles_repo_path }}/scripts/check-mail.timer"
    dest: "{{ home_dir }}/.config/systemd/user/check-mail.timer"
    mode: '0644'
    remote_src: no
  become: false

- name: Активация и запуск check-mail.timer
  ansible.builtin.systemd:
    scope: user
    name: check-mail.timer
    enabled: true
    state: started
    daemon_reload: true
  become: false
  failed_when: false
