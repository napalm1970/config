---
- name: Проверка, что мы не под root
  ansible.builtin.fail:
    msg: "Не запускайте этот playbook под пользователем root! Используйте обычного пользователя с sudo."
  when: ansible_user_id == 'root'

- name: Установка системных пакетов (pacman)
  become: true
  community.general.pacman:
    name: "{{ system_packages }}"
    state: present
    update_cache: true

- name: Удаление старой версии starship из /usr/local/bin (если есть)
  become: true
  ansible.builtin.file:
    path: /usr/local/bin/starship
    state: absent

- name: Сборка и установка Neovim из исходников
  block:
    - name: Удаление старой директории сборки neovim
      ansible.builtin.file:
        path: "{{ neovim_build_dir }}"
        state: absent

    - name: Клонирование репозитория Neovim
      ansible.builtin.git:
        repo: https://github.com/neovim/neovim.git
        dest: "{{ neovim_build_dir }}"
        version: stable

    - name: Сборка Neovim
      ansible.builtin.command: make CMAKE_BUILD_TYPE=Release
      args:
        chdir: "{{ neovim_build_dir }}"
        creates: "{{ neovim_build_dir }}/build/bin/nvim"

    - name: Установка Neovim
      become: true
      ansible.builtin.command: make install
      args:
        chdir: "{{ neovim_build_dir }}"
        creates: /usr/local/bin/nvim

    - name: Очистка директории сборки neovim
      ansible.builtin.file:
        path: "{{ neovim_build_dir }}"
        state: absent

- name: Сборка mail-rs для Waybar
  block:
    - name: Копирование исходников mail-rs во временную директорию
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../waybar/mail-rs"
        dest: "{{ mail_rs_build_dir }}/"
        mode: '0755'

    - name: Сборка mail-rs через Cargo
      ansible.builtin.command: cargo build --release
      args:
        chdir: "{{ mail_rs_build_dir }}"
        creates: "{{ mail_rs_build_dir }}/target/release/mail-rs"

    - name: Создание ~/.local/bin
      ansible.builtin.file:
        path: "{{ local_bin_dir }}"
        state: directory
        mode: '0755'

    - name: Установка mail-rs в ~/.local/bin
      ansible.builtin.copy:
        src: "{{ mail_rs_build_dir }}/target/release/mail-rs"
        dest: "{{ local_bin_dir }}/mail-rs"
        mode: '0755'
        remote_src: yes

    - name: Очистка временной директории mail-rs
      ansible.builtin.file:
        path: "{{ mail_rs_build_dir }}"
        state: absent

- name: Сборка weather-rs для Waybar
  block:
    - name: Копирование исходников weather-rs во временную директорию
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../waybar/weather-rs"
        dest: "{{ weather_rs_build_dir }}/"
        mode: '0755'

    - name: Сборка weather-rs через Cargo
      ansible.builtin.command: cargo build --release
      args:
        chdir: "{{ weather_rs_build_dir }}"
        creates: "{{ weather_rs_build_dir }}/target/release/weather-rs"

    - name: Установка weather-rs в ~/.local/bin
      ansible.builtin.copy:
        src: "{{ weather_rs_build_dir }}/target/release/weather-rs"
        dest: "{{ local_bin_dir }}/weather-rs"
        mode: '0755'
        remote_src: yes

    - name: Очистка временной директории weather-rs
      ansible.builtin.file:
        path: "{{ weather_rs_build_dir }}"
        state: absent

- name: Проверка наличия yay
  ansible.builtin.shell: command -v yay
  register: packages_yay_check
  failed_when: false
  changed_when: false

- name: Установка yay-bin (AUR helper)
  when: packages_yay_check.rc != 0
  block:
    - name: Удаление старой директории сборки yay
      become: true
      ansible.builtin.file:
        path: "{{ yay_bin_build_dir }}"
        state: absent

    - name: Установка зависимостей для сборки yay
      become: true
      community.general.pacman:
        name:
          - git
          - base-devel
        state: present

    - name: Клонирование репозитория yay-bin
      ansible.builtin.git:
        repo: https://aur.archlinux.org/yay-bin.git
        dest: "{{ yay_bin_build_dir }}"
        version: master

    - name: Сборка yay-bin
      ansible.builtin.command: makepkg -s --noconfirm
      args:
        chdir: "{{ yay_bin_build_dir }}"
        creates: "{{ yay_bin_build_dir }}/yay-bin-*.pkg.tar.*"
      # makepkg -si сам установит пакет через sudo (если настроено) или потребует пароль.
      # Но в Ansible лучше собрать и установить через pacman -U для контроля.

    - name: Поиск собранного пакета yay-bin
      ansible.builtin.find:
        paths: "{{ yay_bin_build_dir }}"
        patterns: "yay-bin-*.pkg.tar.*"
      register: yay_package_file

    - name: Установка yay-bin (pacman -U)
      become: true
      ansible.builtin.command: "pacman -U --noconfirm {{ item.path }}"
      with_items: "{{ yay_package_file.files }}"
      when: yay_package_file.matched > 0

    - name: Очистка временной директории
      ansible.builtin.file:
        path: "{{ yay_bin_build_dir }}"
        state: absent

    - name: Финальная проверка наличия yay
      ansible.builtin.shell: command -v yay
      register: final_yay_check
      failed_when: final_yay_check.rc != 0

- name: Сброс SSH соединения для обновления переменных окружения
  ansible.builtin.meta: reset_connection

- name: Перезагрузка фактов (чтобы найти yay)
  ansible.builtin.setup:

- name: Разрешить пользователю запускать pacman без пароля (для yay)
  become: true
  ansible.builtin.copy:
    content: "{{ ansible_user_id }} ALL=(ALL) NOPASSWD: /usr/bin/pacman"
    dest: "/etc/sudoers.d/10-{{ ansible_user_id }}-pacman"
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
  notify: reload systemd user

- name: Установка AUR пакетов
  kewlfft.aur.aur:
    name: "{{ aur_packages }}"
    use: yay
    state: present
  become: false
  environment:
    PATH: "/usr/bin:/usr/local/bin:{{ ansible_env.PATH }}"
  when: aur_packages is defined and aur_packages | length > 0

- name: Удаление правила sudo для pacman (cleanup)
  become: true
  ansible.builtin.file:
    path: "/etc/sudoers.d/10-{{ ansible_user_id }}-pacman"
    state: absent
