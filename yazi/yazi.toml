[mgr]
ratio = [2, 3, 4]
linemode = "permissions"
# show_hidden = true

[opener]
desktop = [{ run = 'dex "$1"', desc = "Dex", for = "linux", orphan = true }]
portproton = [
  { run = 'portproton "$1"', desc = "PortProton", for = "linux", orphan = true },
]
evince = [
  { run = 'evince "$1" &', desc = "Evince", for = "linux", orphan = true },
]
nvim = [
  { run = 'nvim "$@"', desc = "Neovim", block = true, for = "unix" },
]
xdg-open = [{ run = 'xdg-open "$1"', desc = "Open", for = "linux" }]
edit = [
  { run = '${EDITOR:-vi} "$@"', desc = "$EDITOR", block = true, for = "unix" },
]
play = [{ run = "mpv %s", orphan = true, for = "unix" }]


[open]
rules = [
  # Desktop files - must come before text/* mime rule
  { url = "*.desktop", use = "desktop" },
  # Executables
  { url = "*.exe", use = "portproton" },
  # Documents
  { url = "*.pdf", use = "evince" },
  { url = "*.djvu", use = "evince" },
  # Code and text files in Neovim
  { url = "*.lua", use = "nvim" },
  { url = "*.py", use = "nvim" },
  { url = "*.rs", use = "nvim" },
  { url = "*.js", use = "nvim" },
  { url = "*.ts", use = "nvim" },
  { url = "*.go", use = "nvim" },
  { url = "*.sh", use = "nvim" },
  { url = "*.toml", use = "nvim" },
  { url = "*.txt", use = "nvim" },
  { url = "*.md", use = "nvim" },
  # MIME types
  { mime = "application/pdf", use = "evince" },
  { mime = "image/vnd.djvu", use = "evince" },
  { mime = "text/*", use = "nvim" },
  { mime = "video/*", use = "play" },
  { mime = "audio/*", use = "play" },
  # Default
  { url = "*", use = "xdg-open" },
]

[flavor]
dark = "catppuccin-macchiato"
