[mgr]
# show_hidden = true

[opener]
portproton = [
  { run = 'portproton "$1"', desc = "PortProton", for = "linux", orphan = true },
]
evince = [
  { run = 'evince "$1" &', desc = "Evince", for = "linux", orphan = true },
]
open = [
  { run = 'xdg-open "$1"', desc = "Open", for = "linux" },
  { run = 'open "$@"', desc = "Open", for = "macos" },
  { run = 'start "" "%1"', orphan = true, desc = "Open", for = "windows" },
  { run = 'termux-open "$1"', desc = "Open", for = "android" },
]
edit = [
  { run = '${EDITOR:-vi} "$@"', desc = "$EDITOR", block = true, for = "unix" },
  { run = 'code %*', orphan = true, desc = "code", for = "windows" },
  { run = 'code -w %*', block = true, desc = "code (block)", for = "windows" },
]

[open]
rules = [
  { name = "*.pdf", use = "evince" },
  { name = "*.djvu", use = "evince" },
  { mime = "application/pdf", use = "evince" },
  { mime = "image/vnd.djvu", use = "evince" },
  { url = "*.exe", use = "portproton" },
  { url = "*", use = "open" },
]

[flavor]
dark = "catppuccin-macchiato"
